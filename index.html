<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vilson Rodrigues — Construção de Alto Padrão</title>

    <!-- Google Fonts: Inter e Georgia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;900&family=Georgia&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v4 via CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-pale-linen text-charcoal-ink font-sans antialiased overflow-x-hidden">

    <!-- Tela de Carregamento (Loader) -->
    <div id="loader">
        <div id="loader-logo-container">
            <img src="logo.png" alt="Vilson Rodrigues" id="loader-logo" class="h-12 brightness-0 invert">
        </div>

        <!-- Barra de Progresso -->
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="progress-text">0%</div>
    </div>

    <!-- Navbar -->
    <nav id="navbar" class="fixed top-0 left-0 w-full z-50 flex items-center justify-between py-6 px-10 pointer-events-none opacity-0">
        <!-- Logo / Nome -->
        <div class="flex items-center gap-4">
            <img src="logo.png" alt="Vilson Rodrigues" class="h-6">
            <div class="font-serif text-lg tracking-widest uppercase hidden sm:block">Vilson Rodrigues</div>
        </div>

        <!-- Links de Navegação (Placeholder) -->
        <div class="hidden md:flex gap-10">
            <a href="#" class="text-[10px] uppercase tracking-widest hover:text-earthy-ochre transition-colors">Sobre</a>
            <a href="#" class="text-[10px] uppercase tracking-widest hover:text-earthy-ochre transition-colors">Obras</a>
            <a href="#" class="text-[10px] uppercase tracking-widest hover:text-earthy-ochre transition-colors">Contato</a>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main id="main-content" class="opacity-0">
        <!-- As seções serão adicionadas posteriormente -->
    </main>

    <!-- Scripts -->
    <!-- GSAP + ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Lenis (Smooth Scroll) -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

    <script src="main.js"></script>
</body>
</html>
